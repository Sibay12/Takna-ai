<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TAKNA Admin</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--text:#141a33;--mut:#7a829e;--ac:#6d5efc;--ac2:#22d3ee;--bd:#e8ebf5;--red:#ef4444;--grn:#10b981;--sh:0 4px 24px rgba(30,40,90,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#090c18;--card:#121830;--text:#eef0ff;--mut:#8b94b8;--ac:#8b7fff;--bd:#1f2745;--sh:0 4px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:none;min-height:100vh}
aside{position:fixed;inset:0 auto 0 0;width:230px;background:var(--card);border-right:1px solid var(--bd);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:4px 8px 18px}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 4px 14px var(--ac)}
nav{display:flex;flex-direction:column;gap:4px;flex:1}
nav button{display:flex;align-items:center;gap:10px;background:none;color:var(--mut);border:0;border-radius:12px;padding:10px 12px;font:inherit;font-weight:600;text-align:left}
nav button.on{background:linear-gradient(135deg,var(--ac),#8f7bff);color:#fff;box-shadow:0 6px 16px rgba(109,94,252,.35)}
section{margin-left:230px;padding:26px 28px 40px;max-width:1000px}
h1{font-size:26px;margin:0 0 18px;letter-spacing:-.5px}h3{margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.grid .card{margin:0}
.stat .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(109,94,252,.18),rgba(34,211,238,.18));font-size:18px;margin-bottom:10px}
.n{font-size:28px;font-weight:800;letter-spacing:-1px}.m{color:var(--mut);font-size:13px}
label{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
input:not([type=checkbox]),select,textarea{font:inherit;width:100%;background:var(--bg);color:var(--text);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin:5px 0 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(109,94,252,.18)}
button{font:inherit;font-weight:600;background:linear-gradient(135deg,var(--ac),#8f7bff);color:#fff;border:0;border-radius:12px;padding:9px 14px;cursor:pointer}
button.ghost{background:var(--bg);color:var(--text);border:1px solid var(--bd)}button.red{background:var(--red)}button.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.hd,.line{display:flex;justify-content:space-between;align-items:center;gap:10px}.line{padding:8px 0}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--mut);border:1px solid var(--bd)}
.pill.ok{background:rgba(16,185,129,.14);color:var(--grn);border-color:transparent}.pill.bad{background:rgba(239,68,68,.14);color:var(--red);border-color:transparent}
.pill.pro{background:rgba(109,94,252,.15);color:var(--ac);border-color:transparent}
.user{display:flex;gap:12px}.av{flex:none;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.user .b{min-width:0;flex:1}.user b{overflow-wrap:anywhere}
.sw{position:relative;width:46px;height:26px;flex:none}.sw input{opacity:0;position:absolute;inset:0;margin:0;z-index:2}
.sw i{position:absolute;inset:0;background:var(--bd);border-radius:99px;transition:.2s}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--ac)}.sw input:checked+i:after{left:23px}
#login{max-width:360px;margin:14vh auto;padding:22px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:99px;display:none;z-index:9;font-weight:600}
@media(max-width:760px){
 aside{inset:auto 0 0 0;width:auto;flex-direction:row;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--bd);z-index:5;overflow-x:auto}
 .brand,aside>.ghost{display:none}nav{flex-direction:row;gap:2px}
 nav button{flex-direction:column;gap:2px;padding:7px 11px;font-size:11px;white-space:nowrap}nav button span{font-size:18px}
 section{margin:0;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 100px}h1{font-size:22px}}
</style></head><body>
<div id="login" class="card"><div class="brand"><span class="logo"></span>TAKNA Admin</div>
<label>Email</label><input id="le" type="email" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password">
<button onclick="login()" style="width:100%">Sign in</button><p class="m" id="lerr"></p></div>
<div id="app"><aside><div class="brand"><span class="logo"></span>TAKNA</div><nav id="nav"></nav><button class="ghost" onclick="logout()">Logout</button></aside>
<section><h1 id="title"></h1><div id="v"></div></section></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id),val=id=>$(id).value;let T=localStorage.getItem('adm'),S={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2200)}
async function api(p,m='GET',b){const r=await fetch('/api'+p,{method:m,headers:{'content-type':'application/json',authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}
const run=f=>async(...a)=>{try{return await f(...a)}catch(e){toast('Error: '+e.message)}};
const sw=(id,on)=>`<label class="sw"><input type="checkbox" id="${id}" ${on?'checked':''}><i></i></label>`;
async function login(){try{const j=await api('/auth/login','POST',{email:val('le'),password:val('lp')});
 if(j.user.role!=='admin')throw new Error('Not an admin account');T=j.token;localStorage.setItem('adm',T);start()}catch(e){$('lerr').textContent=e.message}}
function logout(){localStorage.removeItem('adm');location.reload()}
const TABS=[['dash','📊','Dashboard'],['users','👥','Users'],['ai','🔑','AI & Keys'],['limits','⏱️','Limits'],['ads','📢','Ads'],['codes','🎟️','Codes'],['pay','💳','Payments'],['update','🚀','Updates'],['opt','🛠️','Optimize'],['app','⚙️','App']];
async function start(){try{await api('/admin/stats')}catch(e){return}
 $('login').style.display='none';$('app').style.display='block';
 $('nav').innerHTML=TABS.map(([k,i,n])=>`<button id="t_${k}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join('');go('dash')}
const go=run(async k=>{TABS.forEach(t=>$('t_'+t[0]).classList.toggle('on',t[0]===k));$('title').textContent=TABS.find(t=>t[0]===k)[2];S=await api('/admin/settings');await V[k]()});
const V={};
V.dash=async()=>{const s=await api('/admin/stats'),p=s.ping;
 $('v').innerHTML=`<div class="grid">${[['👥','Users',s.users],['⭐','Pro',s.pro],['🚫','Banned',s.banned],['💬','Today',s.messagesToday],['📈','All time',s.messagesTotal],['💰','Revenue ₹',s.revenue||0]].map(([i,a,b])=>`<div class="card stat"><div class="ico">${i}</div><div class="n">${b}</div><div class="m">${a}</div></div>`).join('')}</div>
 <div class="card"><div class="hd"><h3>Server keep-alive</h3><span class="pill ${p.ok?'ok':p.ok===false?'bad':''}">${p.ok?'Healthy':p.ok===false?'Failed':'Not run yet'}</span></div>
 <p class="m">${p.at?'Last ping '+new Date(p.at).toLocaleString()+' · '+p.ms+' ms':esc(p.note||'Waiting for the first ping')}</p>
 <div class="line"><b>Self-ping</b>${sw('sp',S.app.selfPing!==false)}</div>
 <label>Interval (minutes, 1 to 14)</label><input id="pm" type="number" min="1" max="14" value="${S.app.pingMin||10}">
 <div class="row"><button onclick="spSave()">Save</button><button class="ghost" onclick="pingNow()">Ping now</button></div></div>`};
const spSave=run(async()=>{S.app={...S.app,selfPing:$('sp').checked,pingMin:Math.min(14,Math.max(1,+val('pm')||10))};await save('app',S.app)});
const pingNow=run(async()=>{await api('/admin/ping','POST');toast('Pinged');V.dash()});
V.users=async(q='')=>{const l=await api('/admin/users?q='+encodeURIComponent(q));
 $('v').innerHTML=`<input id="uq" placeholder="🔍 Search by email" value="${esc(q)}" onchange="usr(this.value)">`+l.map(u=>`<div class="card user"><div class="av">${esc((u.email||'?')[0].toUpperCase())}</div><div class="b">
 <b>${esc(u.email)}</b><div class="m">${esc(u.name)} · today ${u.count} · total ${u.total}</div>
 <div class="row" style="margin:6px 0"><span class="pill ${u.plan==='free'?'':'pro'}">${u.plan}${u.planUntil&&u.plan!=='free'?' · '+u.planUntil.slice(0,10):''}</span>${u.role==='admin'?'<span class="pill ok">admin</span>':''}${u.banned?'<span class="pill bad">banned</span>':''}</div>
 <div class="row"><button class="sm" onclick="upd('${u.id}',{plan:'pro',planUntil:new Date(Date.now()+30*864e5).toISOString()})">Pro 30d</button>
 <button class="sm ghost" onclick="upd('${u.id}',{plan:'free',planUntil:null})">Free</button>
 <button class="sm ghost" onclick="upd('${u.id}',{banned:${!u.banned}})">${u.banned?'Unban':'Ban'}</button>
 <button class="sm ghost" onclick="upd('${u.id}',{role:'${u.role==='admin'?'user':'admin'}'})">${u.role==='admin'?'Remove admin':'Make admin'}</button>
 <button class="sm ghost" onclick="upd('${u.id}',{resetUsage:true})">Reset usage</button>
 <button class="sm ghost" onclick="pw('${u.id}')">Password</button>
 <button class="sm red" onclick="del('${u.id}')">Delete</button></div></div></div>`).join('')};
const usr=run(q=>V.users(q));
const upd=run(async(id,b)=>{await api('/admin/users/'+id,'PATCH',b);toast('Updated');V.users($('uq').value)});
const pw=run(async id=>{const p=prompt('New password (6+ chars)');if(p)await upd(id,{newPassword:p})});
const del=run(async id=>{if(confirm('Delete this user?')){await api('/admin/users/'+id,'DELETE');V.users($('uq').value)}});
const save=run(async(k,o)=>{await api('/admin/settings/'+k,'PUT',o);toast('Saved ✓')});
V.ai=()=>{const a=S.ai;$('v').innerHTML=`<div class="card"><label>Provider</label><select id="ap">${['anthropic','gemini','openai'].map(p=>`<option ${a.provider===p?'selected':''}>${p}</option>`).join('')}</select>
 <label>Model</label><input id="am" value="${esc(a.model)}"><label>API key (leave as is to keep)</label><input id="ak" type="password" value="${esc(a.apiKey)}">
 <label>Base URL (optional)</label><input id="ab" value="${esc(a.baseUrl)}">
 <label>System prompt</label><textarea id="as" rows="5">${esc(a.system)}</textarea>
 <button onclick="save('ai',{provider:val('ap'),model:val('am'),apiKey:val('ak'),baseUrl:val('ab'),system:val('as')})">Save</button></div>`};
V.limits=()=>{const l=S.limits;$('v').innerHTML=['free','pro'].map(p=>`<div class="card"><div class="hd"><h3>${p==='pro'?'⭐ Pro':'Free'} plan</h3></div><label>Messages per day</label><input id="${p}d" type="number" value="${l[p].daily}">
 <label>Cool-down seconds between messages</label><input id="${p}c" type="number" value="${l[p].cooldown}"></div>`).join('')+
 `<button onclick="save('limits',{free:{daily:val('freed'),cooldown:val('freec')},pro:{daily:val('prod'),cooldown:val('proc')}})">Save limits</button>`};
V.ads=()=>{const a=S.ads;$('v').innerHTML=`<div class="card line"><div><b>Ads enabled</b><div class="m">Shown to Free users only</div></div>${sw('ae',a.enabled)}</div>`+
 a.items.map((x,i)=>`<div class="card"><div class="hd"><b>${esc(x.title)}</b><span class="pill ${x.active?'ok':''}">${x.active?'live':'off'}</span></div><div class="m">${esc(x.text)}<br>${esc(x.link)}</div><div class="row">
 <button class="sm ghost" onclick="adTog(${i})">${x.active?'Disable':'Enable'}</button><button class="sm red" onclick="adDel(${i})">Delete</button></div></div>`).join('')+
 `<div class="card"><h3>New ad</h3><input id="at" placeholder="Title"><input id="ax" placeholder="Text"><input id="al" placeholder="Link https://…"><input id="ai" placeholder="Image URL (optional)"><button onclick="adAdd()">Add ad</button></div>`;
 $('ae').onchange=run(async()=>{S.ads.enabled=$('ae').checked;await save('ads',S.ads)})};
const adTog=run(async i=>{S.ads.items[i].active=!S.ads.items[i].active;await save('ads',S.ads);V.ads()});
const adDel=run(async i=>{S.ads.items.splice(i,1);await save('ads',S.ads);V.ads()});
const adAdd=run(async()=>{S.ads.items.push({id:Date.now(),title:val('at'),text:val('ax'),link:val('al'),image:val('ai'),active:true});await save('ads',S.ads);V.ads()});
V.codes=async()=>{const l=await api('/admin/codes');
 $('v').innerHTML=`<div class="card"><h3>Create redeem code</h3><label>Code (blank = random)</label><input id="cc"><label>Days of Pro</label><input id="cd" type="number" value="30"><label>Max uses</label><input id="cm" type="number" value="1"><button onclick="cAdd()">Create</button></div>`+
 l.map(c=>`<div class="card hd"><div><b>${esc(c.code)}</b><div class="m">${c.days} days · used ${c.uses}/${c.maxUses}</div></div><button class="sm red" onclick="cDel('${c._id}')">Delete</button></div>`).join('')};
const cAdd=run(async()=>{await api('/admin/codes','POST',{code:val('cc'),days:val('cd'),maxUses:val('cm')});toast('Created ✓');V.codes()});
const cDel=run(async id=>{await api('/admin/codes/'+id,'DELETE');V.codes()});
V.app=()=>{const a=S.app;$('v').innerHTML=`<div class="card"><label>App name</label><input id="an" value="${esc(a.name)}">
 <label>Announcement banner (blank = none)</label><input id="aa" value="${esc(a.announcement)}">
 <label>Google OAuth Web Client ID</label><input id="ag" value="${esc(a.googleClientId)}">
 <div class="line"><div><b>Maintenance mode</b><div class="m">Blocks chat for non-admins</div></div>${sw('am2',a.maintenance)}</div>
 <button onclick="save('app',{...S.app,name:val('an'),announcement:val('aa'),googleClientId:val('ag'),maintenance:$('am2').checked})">Save</button></div>`};
V.pay=async()=>{const p=S.pay,o=await api('/admin/orders');const f=(id,l,v,t='text')=>`<label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}">`;
 $('v').innerHTML=`<div class="card"><div class="hd"><h3>TAKNAPAY gateway</h3>${sw('pe',p.enabled)}</div>
 <p class="m">Webhook URL for your TAKNAPAY dashboard:<br><b>${esc(location.origin)}/api/pay/webhook</b></p>
 <p class="m">Fill the paths, field names and header names exactly as written in TAKNAPAY's API docs.</p>
 ${f('pb','Base URL',p.baseUrl)}${f('pc','Create-order path',p.createPath)}${f('ps','Status path, use {id} (optional)',p.statusPath)}
 ${f('pk','API key',p.apiKey,'password')}${f('pw','Webhook secret',p.secret,'password')}
 ${f('ph','Auth header name',p.authHeader)}${f('pa','Auth scheme (Bearer, or blank)',p.authScheme)}${f('pg','Signature header name',p.sigHeader)}
 ${f('pu','Pay-link field in response',p.payUrlField)}${f('po','Order id field',p.orderField)}${f('pt','Status field',p.statusField)}${f('pcur','Currency',p.currency)}
 <button onclick="paySave()">Save gateway</button></div>
 <div class="card"><h3>Plans</h3>${p.plans.map((x,i)=>`<div class="line"><span><b>${esc(x.name)}</b> · ₹${x.price} · ${x.days} days</span><button class="sm red" onclick="planDel(${i})">✕</button></div>`).join('')}
 <input id="pn" placeholder="Plan name"><input id="pp" type="number" placeholder="Price"><input id="pd" type="number" placeholder="Days of Pro"><button onclick="planAdd()">Add plan</button></div>
 <div class="card"><h3>Orders</h3>${o.map(x=>`<div class="line"><span><b>${esc(x.orderId)}</b><div class="m">${esc(x.email)} · ${esc(x.planName)} · ₹${x.amount}</div></span><span><span class="pill ${x.status==='paid'?'ok':x.status==='failed'?'bad':''}">${x.status}</span> ${x.status!=='paid'?`<button class="sm ghost" onclick="markPaid('${x._id}')">Mark paid</button>`:''}</span></div>`).join('')||'<p class="m">No orders yet</p>'}</div>`};
const paySave=run(async()=>{S.pay={...S.pay,enabled:$('pe').checked,baseUrl:val('pb'),createPath:val('pc'),statusPath:val('ps'),apiKey:val('pk'),secret:val('pw'),authHeader:val('ph'),authScheme:val('pa'),sigHeader:val('pg'),payUrlField:val('pu'),orderField:val('po'),statusField:val('pt'),currency:val('pcur')};await save('pay',S.pay)});
const planAdd=run(async()=>{S.pay.plans.push({name:val('pn'),price:+val('pp'),days:+val('pd')});await save('pay',S.pay);S=await api('/admin/settings');V.pay()});
const planDel=run(async i=>{S.pay.plans.splice(i,1);await save('pay',S.pay);S=await api('/admin/settings');V.pay()});
const markPaid=run(async id=>{if(confirm('Mark paid and grant Pro?')){await api('/admin/orders/'+id+'/paid','POST');V.pay()}});
V.update=()=>{const u=S.update;$('v').innerHTML=`<div class="card"><h3>Publish app update</h3><p class="m">Host the APK (GitHub release, Drive, your site) and paste the direct link. The app checks <b>/api/update?v=VERSION</b> on launch.</p>
 <label>Latest version</label><input id="uv" value="${esc(u.latestVersion)}"><label>Minimum supported version</label><input id="um" value="${esc(u.minVersion)}">
 <label>Download link (APK)</label><input id="ul" value="${esc(u.url)}"><label>What's new</label><textarea id="uc" rows="4">${esc(u.changelog)}</textarea>
 <div class="line"><div><b>Force update</b><div class="m">Users must update before using the app</div></div>${sw('uf',u.force)}</div>
 <div class="m">Last release: ${esc(u.releasedAt||'never')}</div><div class="row"><button onclick="updSave()">Publish update</button></div></div>`};
const updSave=run(async()=>{S.update={latestVersion:val('uv'),minVersion:val('um'),url:val('ul'),changelog:val('uc'),force:$('uf').checked,releasedAt:new Date().toISOString().slice(0,10)};await save('update',S.update)});
V.opt=async()=>{const s=await api('/admin/system');
 $('v').innerHTML=`<div class="grid">${[['⏳','Uptime min',s.uptimeMin],['🧠','Memory MB',s.rssMB],['🗄️','DB ping ms',s.dbMs],['⚡','Cached keys',s.cacheKeys]].map(([i,a,b])=>`<div class="card stat"><div class="ico">${i}</div><div class="n">${b}</div><div class="m">${a}</div></div>`).join('')}</div>
 <div class="card"><h3>Cleanup tools</h3><p class="m">Node ${esc(s.node)} · gzip, settings cache and DB indexes are already on.</p>
 ${[['cache','Clear settings cache'],['expired','Downgrade expired Pro users'],['codes','Delete used-up codes'],['orders','Delete unpaid orders older than 7 days']].map(([t,l])=>`<div class="line"><span>${l}</span><button class="sm ghost" onclick="optRun('${t}')">Run</button></div>`).join('')}
 <div class="line"><span>Delete free users who never chatted, older than <input id="od" type="number" value="180" style="width:80px;display:inline;margin:0 4px"> days</span><button class="sm red" onclick="optRun('inactive')">Run</button></div></div>`};
const optRun=run(async t=>{if(t==='inactive'&&!confirm('Delete these users permanently?'))return;const j=await api('/admin/optimize/'+t,'POST',{days:t==='inactive'?+val('od'):undefined});toast('Done · '+j.done+' affected');V.opt()});
if(T)start();
</script></body></html>
