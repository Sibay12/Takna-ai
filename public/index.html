<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TAKNA Assist</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--text:#141a33;--mut:#7a829e;--ac:#6d5efc;--ac2:#22d3ee;--bd:#e8ebf5;--red:#ef4444}
@media(prefers-color-scheme:dark){:root{--bg:#090c18;--card:#121830;--text:#eef0ff;--mut:#8b94b8;--ac:#8b7fff;--bd:#1f2745}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button{font:inherit;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--ac),#8f7bff);border:0;border-radius:12px;padding:10px 14px}
button.g{background:var(--card);color:var(--text);border:1px solid var(--bd)}
input,select{font:inherit;width:100%;background:var(--bg);color:var(--text);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin:5px 0 10px}
label{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase}
.m{color:var(--mut);font-size:13px}
#auth{margin:auto;width:min(380px,92vw);background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px}
.logo{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--ac),var(--ac2));margin-bottom:10px}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
header b{flex:1}.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(109,94,252,.15);color:var(--ac)}
.bn{padding:8px 14px;background:rgba(109,94,252,.12);font-size:14px}
#ad{margin:8px 14px 0;padding:10px 12px;border:1px dashed var(--bd);border-radius:12px;background:var(--card);font-size:14px}
#ad a{color:var(--ac);font-weight:600;text-decoration:none}
#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:4px}
.a{align-self:flex-start;background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
form{display:flex;gap:8px;padding:10px 14px;background:var(--card);border-top:1px solid var(--bd)}
form input{margin:0;border-radius:99px;flex:1;min-width:0}
.ic{width:46px;height:46px;border-radius:50%;padding:0;font-size:20px}.rec{background:var(--red)!important}
#st{font-size:12px;color:var(--mut);padding:2px 16px;min-height:18px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
#panel{background:var(--card);width:100%;max-height:85vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px 28px}
.plan{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}
.line{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
</style></head><body>
<div id="auth" hidden><div class="logo"></div><h2 id="an" style="margin:0 0 4px">TAKNA Assist</h2><p class="m">Sign in to continue</p>
<label>Name (new accounts)</label><input id="nm"><label>Email</label><input id="em" type="email" autocomplete="username">
<label>Password</label><input id="pw" type="password" autocomplete="current-password">
<button onclick="doAuth('login')" style="width:100%">Login</button><button class="g" onclick="doAuth('register')" style="width:100%;margin-top:8px">Create account</button>
<div id="gbtn" style="margin-top:12px"></div><p class="m" id="aerr" style="color:var(--red)"></p></div>
<div id="main" hidden>
<header><b id="hn">TAKNA Assist</b><span class="pill" id="pp"></span><button class="g" onclick="menu()">☰</button></header>
<div class="bn" id="bn" hidden></div><div id="ad" hidden></div>
<div id="log"></div><div id="st"></div>
<form id="f"><button type="button" class="ic" id="mic" onclick="listen()">🎤</button><input id="q" placeholder="Type or speak…" autocomplete="off"><button class="ic" id="sb" type="submit">➤</button></form></div>
<div id="sheet" hidden onclick="if(event.target===this)closeSheet()"><div id="panel"></div></div>
<script>
const $=id=>document.getElementById(id),NB=window.AndroidBridge;
let T=localStorage.getItem('tk'),ME=null,CFG={},msgs=[],busy=false,until=0,speak=true,rec=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,m='GET',b){const r=await fetch('/api'+p,{method:m,headers:{'content-type':'application/json',...(T?{authorization:'Bearer '+T}:{})},body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||r.status);e.data=j;e.status=r.status;throw e}return j}
function add(role,t){const d=document.createElement('div');d.className='msg '+(role==='u'?'u':'a');d.textContent=t;$('log').appendChild(d);$('log').scrollTop=1e9;return d}
function closeSheet(){$('sheet').hidden=true}
function panel(h){$('panel').innerHTML=h;$('sheet').hidden=false}
async function boot(){
 try{CFG=await api('/config')}catch(e){}
 $('an').textContent=CFG.name||'TAKNA Assist';$('hn').textContent=CFG.name||'TAKNA Assist';
 if(CFG.googleClientId&&!NB){const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>{google.accounts.id.initialize({client_id:CFG.googleClientId,callback:r=>finish(api('/auth/google','POST',{credential:r.credential}))});google.accounts.id.renderButton($('gbtn'),{theme:'outline',width:300})};document.head.appendChild(s)}
 if(T){try{await load();return}catch(e){T=null;localStorage.removeItem('tk')}}
 $('auth').hidden=false;
}
async function finish(p){try{const j=await p;T=j.token;localStorage.setItem('tk',T);$('auth').hidden=true;await load()}catch(e){$('aerr').textContent=e.message}}
function doAuth(m){finish(api('/auth/'+m,'POST',{email:$('em').value,password:$('pw').value,name:$('nm').value}))}
function logout(){localStorage.removeItem('tk');location.reload()}
async function load(){
 ME=await api('/me');$('main').hidden=false;$('auth').hidden=true;head();
 if(CFG.maintenance)note('Server is under maintenance.');else if(CFG.announcement)note(CFG.announcement);
 ads();checkUpdate();
 if(!$('log').children.length)add('a','Hi! Tap the mic or type. I can chat, answer questions and help with code.');
 try{const h=await api('/history');if(h.saveHistory&&h.messages.length){$('log').innerHTML='';h.messages.forEach(m=>add(m.role==='user'?'u':'a',m.content));msgs=h.messages.slice(-8).map(m=>({role:m.role,content:m.content}))}}catch(e){}
}
function head(){const u=ME.user;$('pp').textContent=u.plan==='free'?'FREE':'PRO';$('st').textContent=(ME.limits.daily-ME.usedToday)+' messages left today'}
function note(t){$('bn').textContent=t;$('bn').hidden=false}
function ads(){const l=(CFG.ads||[]);if(ME.user.plan!=='free'||!l.length){$('ad').hidden=true;return}let i=0;const show=()=>{const a=l[i++%l.length];$('ad').innerHTML=`<small class="m">Ad</small><br><a href="${esc(a.link)}" target="_blank">${esc(a.title)}</a> ${esc(a.text)}`;$('ad').hidden=false};show();setInterval(show,9000)}
async function checkUpdate(){if(!NB)return;try{const u=await api('/update?v='+encodeURIComponent(NB.version()));if(!u.updateAvailable)return;
 panel(`<h3>Update available (${esc(u.latest)})</h3><p>${esc(u.changelog||'')}</p><a href="${esc(u.url)}" target="_blank"><button style="width:100%">Download update</button></a>${u.force?'':'<button class="g" style="width:100%;margin-top:8px" onclick="closeSheet()">Later</button>'}`);
 if(u.force)$('sheet').onclick=null}catch(e){}}
function tick(){const s=Math.ceil((until-Date.now())/1000);$('sb').disabled=s>0;if(s>0){$('st').textContent='Cool down: '+s+'s';setTimeout(tick,500)}else head()}
$('f').onsubmit=e=>{e.preventDefault();send($('q').value)};
async function send(t){t=t.trim();if(!t||busy||Date.now()<until)return;$('q').value='';add('u',t);busy=true;const b=add('a','…');
 try{const j=await api('/chat','POST',{messages:[...msgs.slice(-8),{role:'user',content:t}]});b.textContent=j.text;msgs.push({role:'user',content:t},{role:'assistant',content:j.text});
  ME.usedToday=ME.limits.daily-j.remaining;until=Date.now()+ME.limits.cooldown*1000;say(j.text)}
 catch(e){b.textContent=e.message;if(e.data?.wait)until=Date.now()+e.data.wait*1000;if(e.data?.upgrade)plans();if(e.status===401)logout()}
 busy=false;tick()}
function say(t){if(!speak||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[*_`#]/g,''));u.lang=localStorage.getItem('lang')||'en-US';
 u.pitch=localStorage.getItem('voice')==='karan'?0.75:1.1;speechSynthesis.speak(u)}
function listen(){const lang=localStorage.getItem('lang')||'en-US';
 if(NB){NB.listen(lang);$('mic').classList.add('rec');return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return add('a','Voice input isn’t supported here. Please type.');
 if(rec){rec.stop();return}rec=new SR();rec.lang=lang;let f='';rec.onresult=e=>{f=[...e.results].map(r=>r[0].transcript).join('');$('q').value=f};
 rec.onstart=()=>$('mic').classList.add('rec');rec.onend=()=>{$('mic').classList.remove('rec');rec=null;if(f)send(f)};rec.start()}
window.onNativeSpeech=(t,fin)=>{$('q').value=t;if(fin){$('mic').classList.remove('rec');if(t)send(t)}};
function menu(){const u=ME.user;let hs=false;
 api('/history').then(h=>{hs=h.saveHistory;const c=$('hc');if(c)c.checked=hs}).catch(()=>{});
 panel(`<h3>${esc(u.email)}</h3><p class="m">${u.plan==='free'?'Free plan':'Pro until '+esc((u.planUntil||'').slice(0,10))} · ${ME.limits.daily-ME.usedToday} messages left today</p>
 <label>Voice</label><select id="vc" onchange="localStorage.setItem('voice',this.value)"><option value="tara">Tara ♀</option><option value="karan">Karan ♂</option></select>
 <label>Language</label><select id="lg" onchange="localStorage.setItem('lang',this.value)"><option value="en-US">English</option><option value="hi-IN">हिन्दी</option><option value="en-IN">English (India)</option></select>
 <div class="line"><span>Save chat history (7 days)</span><input type="checkbox" id="hc" style="width:auto;margin:0" onchange="api('/history/consent','PUT',{on:this.checked})"></div>
 <button class="g" style="width:100%;margin-bottom:8px" onclick="api('/history','DELETE').then(()=>{$('log').innerHTML='';msgs=[];closeSheet()})">Delete my history</button>
 <button style="width:100%" onclick="plans()">⭐ Upgrade to Pro</button>
 <label style="display:block;margin-top:12px">Redeem code</label><input id="rc"><button class="g" style="width:100%" onclick="redeem()">Redeem</button>
 <button class="g" style="width:100%;margin-top:12px" onclick="logout()">Logout</button>`);
 $('vc').value=localStorage.getItem('voice')||'tara';$('lg').value=localStorage.getItem('lang')||'en-US'}
async function redeem(){try{const j=await api('/redeem','POST',{code:$('rc').value});ME.user=j.user;ME=await api('/me');head();ads();closeSheet();add('a','Pro activated. Thank you!')}catch(e){alert(e.message)}}
async function plans(){try{const p=await api('/plans');if(!p.enabled||!p.plans.length){panel('<h3>Upgrade to Pro</h3><p>Online payments aren’t open yet. If you have a redeem code, enter it in the menu.</p>');return}
 panel('<h3>Upgrade to Pro</h3><p class="m">More messages and a shorter cool down. No ads.</p>'+p.plans.map(x=>`<div class="plan"><span><b>${esc(x.name)}</b><br><span class="m">${x.days} days</span></span><button onclick="pay('${esc(x.id)}')">₹${x.price}</button></div>`).join(''))}catch(e){alert(e.message)}}
async function pay(id){try{const j=await api('/pay/create','POST',{planId:id,returnUrl:location.origin});window.open(j.payUrl,'_blank');panel('<h3>Waiting for payment…</h3><p class="m">Finish paying in the browser, then come back here. This updates by itself.</p>');
 for(let i=0;i<75;i++){await new Promise(r=>setTimeout(r,4000));const s=await api('/pay/status/'+j.orderId);if(s.status==='paid'){ME=await api('/me');head();ads();panel('<h3>🎉 You are Pro!</h3>');return}if(s.status==='failed'){panel('<h3>Payment failed</h3>');return}}}catch(e){alert(e.message)}}
boot();
</script></body></html>
