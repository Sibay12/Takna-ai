name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle -p android assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk takna-assist.apk
      - uses: actions/upload-artifact@v4
        with: { name: takna-assist-apk, path: takna-assist.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TAKNA Assist build ${{ github.run_number }}
          files: takna-assist.apk
